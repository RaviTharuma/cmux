name: assemble-title-lock-sources
on:
  push:
    paths:
      - .github/workflows/assemble-title-lock-sources.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/title-lock-assoc-f1c1
          fetch-depth: 0
      - name: Assemble Sources from zlib archive chunks
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64, zlib, struct, hashlib
          from pathlib import Path
          parts_dir = Path('.tmp-upload-parts')
          chunks = sorted(parts_dir.glob('archive.*.b64'))
          assert chunks, f'no chunks in {parts_dir.resolve()}'
          print('chunks', [c.name for c in chunks])
          b64 = ''.join(p.read_text().strip() for p in chunks)
          blob = zlib.decompress(base64.b64decode(b64))
          assert blob.startswith(b'CMUX1'), blob[:10]
          off = 5
          written = {}
          while off < len(blob):
              (nlen,) = struct.unpack_from('>H', blob, off); off += 2
              name = blob[off:off+nlen].decode(); off += nlen
              (dlen,) = struct.unpack_from('>I', blob, off); off += 4
              data = blob[off:off+dlen]; off += dlen
              written[name] = data
              print(name, len(data), hashlib.sha256(data).hexdigest())
          expect = {
            'controller': '65e50db35ed80b779d9c8003fb44622a0f7cc2783fdc58a0021031afccb4d127',
            'sessionhost': 'a4fdcac18735c32ed4405af08ceb57d8a6affdae3c79f07f5ec2eb27f458d87c',
          }
          mapping = {
            'controller': Path('Sources/RemoteHerdrController.swift'),
            'sessionhost': Path('Sources/RemoteHerdrSessionHost.swift'),
          }
          for key, path in mapping.items():
              data = written[key]
              got = hashlib.sha256(data).hexdigest()
              assert got == expect[key], (key, got, expect[key])
              path.write_bytes(data)
              print('wrote', path, path.stat().st_size)
          PY
      - name: Commit assembled sources and remove staging
        run: |
          set -euo pipefail
          git config user.name "Ravi Tharuma"
          git config user.email "25951435+RaviTharuma@users.noreply.github.com"
          rm -rf .tmp-upload-parts
          rm -f .github/workflows/assemble-title-lock-sources.yml
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "feat(herdr): wire title-lock associations + handoff heartbeat TTL"
          git push origin HEAD:cursor/title-lock-assoc-f1c1
