name: update-pr10045-main
on:
  push:
    paths:
      - .github/workflows/update-pr10045-main.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/nested-topology-herdr-v1-becf
          fetch-depth: 0

      - name: Merge manaflow-ai/cmux main
        run: |
          set -euo pipefail
          git config user.name "Ravi Tharuma"
          git config user.email "25951435+RaviTharuma@users.noreply.github.com"
          git remote add upstream https://github.com/manaflow-ai/cmux.git
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date with upstream/main"
            exit 0
          fi
          git merge upstream/main -m "merge: sync upstream main into nested-topology Herdr PR (#10045)"
          git push origin HEAD:cursor/nested-topology-herdr-v1-becf

      - name: Remove one-shot workflow
        if: always()
        run: |
          set -euo pipefail
          git fetch origin cursor/nested-topology-herdr-v1-becf
          git checkout -B cursor/nested-topology-herdr-v1-becf origin/cursor/nested-topology-herdr-v1-becf
          if [ -f .github/workflows/update-pr10045-main.yml ]; then
            git rm -f .github/workflows/update-pr10045-main.yml
            git config user.name "Ravi Tharuma"
            git config user.email "25951435+RaviTharuma@users.noreply.github.com"
            git commit -m "chore: remove one-shot update-pr10045-main workflow" || true
            git push origin HEAD:cursor/nested-topology-herdr-v1-becf || true
          fi
