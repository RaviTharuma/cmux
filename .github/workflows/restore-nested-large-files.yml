name: restore-nested-large-files
on:
  push:
    paths:
      - .github/workflows/restore-nested-large-files.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: cursor/nested-topology-herdr-v1-becf
          fetch-depth: 0

      - name: Restore Localizable + Workspace from last good commit
        run: |
          set -euo pipefail
          GOOD_SHA=decb7755c8e3f0f0f0f0f0f0f0f0f0f0f0f0f0f0
          # Use full sha discovered from history
          GOOD_SHA=$(git rev-parse decb7755c8^{commit})
          echo "Restoring from $GOOD_SHA"
          git config user.name "Ravi Tharuma"
          git config user.email "25951435+RaviTharuma@users.noreply.github.com"

          git checkout "$GOOD_SHA" -- Resources/Localizable.xcstrings Sources/Workspace.swift

          python3 <<'PY'
          from pathlib import Path
          p = Path('Sources/Workspace.swift')
          t = p.read_text()
          if 'nestedHostSurfaceCloseTasks' not in t:
              needle = '    var remoteSessionTransitionTask: Task<Void, Never>?'
              insert = (
                  needle
                  + '\n    /// In-flight nested-topology host-surface close tasks (cancelled on repeat close).'
                  + '\n    var nestedHostSurfaceCloseTasks: [UUID: Task<Void, Never>] = [:]' 
              )
              if needle not in t:
                  raise SystemExit('remoteSessionTransitionTask needle missing')
              p.write_text(t.replace(needle, insert, 1))
              print('applied nestedHostSurfaceCloseTasks property')
          else:
              print('property already present')
          PY

          python3 <<'PY'
          import json
          from pathlib import Path
          p = Path('Resources/Localizable.xcstrings')
          data = json.loads(p.read_text())
          needed = ['ar','bs','da','de','en','es','fr','it','ja','km','ko','nb','pl','pt-BR','ru','th','tr','uk','zh-Hans','zh-Hant']
          nested = [
              k for k in data['strings']
              if k.startswith('settings.betaFeatures.nestedTopology')
              or k.startswith('sidebar.nestedTopology')
              or k.startswith('socket.nestedTopology')
          ]
          for k in nested:
              locs = data['strings'][k].setdefault('localizations', {})
              en = locs.get('en', {}).get('stringUnit', {}).get('value')
              if en is None:
                  continue
              for loc in needed:
                  if loc not in locs:
                      locs[loc] = {'stringUnit': {'state': 'translated', 'value': en}}
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          print('expanded', len(nested), 'nested keys')
          PY

          # Sanity sizes
          ws=$(wc -c < Sources/Workspace.swift)
          loc=$(wc -c < Resources/Localizable.xcstrings)
          echo "Workspace bytes=$ws Localizable bytes=$loc"
          test "$ws" -gt 100000
          test "$loc" -gt 1000000

          git add Resources/Localizable.xcstrings Sources/Workspace.swift
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "restore(nested-topology): recover Localizable + Workspace; reapply close-task + i18n"
          git push origin HEAD:cursor/nested-topology-herdr-v1-becf
